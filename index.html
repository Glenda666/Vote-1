<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即時線上投票系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12" x-data="pollApp()">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <i class="fa-solid me-2 fa-check-to-slot text-indigo-600 text-2xl"></i>
                <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">VotePulse 即時投票</h1>
            </div>
            <button @click="resetToCreate()" class="text-sm bg-indigo-50 text-indigo-600 hover:bg-indigo-100 font-medium px-3 py-1.5 rounded-lg transition-colors">
                <i class="fa-solid fa-plus mr-1"></i> 發起新投票
            </button>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 pt-8">

        <div x-show="view === 'create'" x-transition class="bg-white rounded-2xl p-6 sm:p-8 shadow-sm border border-slate-100">
            <h2 class="text-2xl font-bold mb-6 text-slate-900">建立新投票</h2>
            
            <form @submit.prevent="createPoll()">
                <div class="mb-5">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">投票主題</label>
                    <input type="text" x-model="newPoll.title" required placeholder="例如：團隊聚餐地點投票" 
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
                </div>

                <div class="mb-5">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">投票選項 (最少 2 個)</label>
                    <div class="space-y-3">
                        <template x-for="(option, index) in newPoll.options" :key="index">
                            <div class="flex items-center gap-2">
                                <input type="text" x-model="newPoll.options[index]" required :placeholder="'選項 ' + (index + 1)"
                                       class="w-full px-4 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
                                <button type="button" @click="removeOption(index)" x-show="newPoll.options.length > 2" 
                                        class="text-slate-400 hover:text-rose-500 p-2 transition-colors">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        </template>
                    </div>
                    <button type="button" @click="addOption()" class="mt-3 text-sm text-indigo-600 hover:text-indigo-700 font-medium inline-flex items-center gap-1">
                        <i class="fa-solid fa-circle-plus"></i> 新增選項
                    </button>
                </div>

                <div class="mb-8">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">設定截止時間 (可選)</label>
                    <input type="datetime-local" x-model="newPoll.deadline"
                           class="w-full sm:w-auto px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-slate-600">
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl shadow-lg shadow-indigo-600/20 transition-all">
                    發起投票並生成連結
                </button>
            </form>
        </div>

        <div x-show="view === 'vote'" x-transition class="space-y-6">
            
            <div class="bg-white rounded-2xl p-6 sm:p-8 shadow-sm border border-slate-100">
                <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
                    <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200" x-show="!isExpired">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1.5 animate-pulse"></span> 進行中
                    </span>
                    <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600" x-show="isExpired">
                        已截止
                    </span>
                    <span class="text-xs text-slate-400" x-show="poll.deadline" x-text="'截止時間：' + formatDeadline(poll.deadline)"></span>
                </div>

                <h2 class="text-2xl font-bold text-slate-900 mb-6" x-text="poll.title"></h2>

                <div x-show="!hasVoted && !isExpired" class="space-y-3">
                    <template x-for="(option, index) in poll.options" :key="index">
                        <button @click="submitVote(index)" 
                                class="w-full text-left p-4 rounded-xl border border-slate-200 hover:border-indigo-500 hover:bg-indigo-50/50 transition-all flex justify-between items-center group">
                            <span class="font-medium text-slate-700 group-hover:text-indigo-600" x-text="option"></span>
                            <i class="fa-regular fa-circle text-slate-300 group-hover:text-indigo-500 transition-colors"></i>
                        </button>
                    </template>
                </div>

                <div x-show="hasVoted" class="bg-indigo-50 border border-indigo-100 rounded-xl p-4 text-indigo-700 text-sm mb-6 flex items-center gap-2">
                    <i class="fa-solid fa-circle-check text-indigo-600"></i>
                    <span>您已完成投票！以下為即時統計結果。</span>
                </div>
                <div x-show="isExpired && !hasVoted" class="bg-slate-100 border border-slate-200 rounded-xl p-4 text-slate-600 text-sm mb-6 flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    <span>此投票已截止，僅提供查看歷史結果。</span>
                </div>

                <div x-show="hasVoted || isExpired" class="mt-6 pt-6 border-t border-slate-100">
                    <h3 class="text-lg font-semibold text-slate-800 mb-4">投票結果統計</h3>
                    
                    <div class="relative h-64 mb-6">
                        <canvas id="pollChart"></canvas>
                    </div>

                    <div class="space-y-2">
                        <template x-for="(votes, index) in poll.votes" :key="index">
                            <div class="flex justify-between items-center text-sm py-1 border-b border-slate-50">
                                <span class="text-slate-600" x-text="poll.options[index]"></span>
                                <div class="font-semibold text-slate-800">
                                    <span x-text="votes"></span> 票 
                                    <span class="text-slate-400 font-normal ml-1" x-text="calcPercentage(votes) + '%'"></span>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <div class="mt-8 pt-6 border-t border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-4">
                    <div class="text-xs text-slate-400">總投票數：<span class="font-semibold text-slate-600" x-text="totalVotes"></span></div>
                    <button @click="copyShareLink()" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 bg-slate-900 hover:bg-slate-800 text-white text-sm font-medium px-4 py-2.5 rounded-xl transition-all">
                        <i class="fa-regular fa-copy"></i> 複製投票連結分享
                    </button>
                </div>
            </div>
        </div>

    </main>

    <script>
        function pollApp() {
            return {
                view: 'create', // 'create' 或 'vote'
                hasVoted: false,
                isExpired: false,
                chartInstance: null,
                newPoll: {
                    title: '',
                    options: ['', ''],
                    deadline: ''
                },
                poll: {
                    id: '',
                    title: '',
                    options: [],
                    votes: [],
                    deadline: ''
                },

                init() {
                    // 解析網址是否帶有投票 ID
                    const urlParams = new URLSearchParams(window.location.search);
                    const pollId = urlParams.get('pollId');

                    if (pollId) {
                        this.loadPoll(pollId);
                    }
                },

                // 新增與刪除選項
                addOption() {
                    this.newPoll.options.push('');
                },
                removeOption(index) {
                    this.newPoll.options.splice(index, 1);
                },

                // 建立投票
                createPoll() {
                    const pollId = 'poll_' + Date.now();
                    const pollData = {
                        id: pollId,
                        title: this.newPoll.title,
                        options: this.newPoll.options.filter(opt => opt.trim() !== ''),
                        votes: new Array(this.newPoll.options.length).fill(0),
                        deadline: this.newPoll.deadline
                    };

                    // 儲存至 LocalStorage
                    localStorage.setItem(pollId, JSON.stringify(pollData));

                    // 切換至投票網址
                    const newUrl = window.location.origin + window.location.pathname + '?pollId=' + pollId;
                    window.history.pushState({ path: newUrl }, '', newUrl);

                    this.loadPoll(pollId);
                },

                // 載入投票資料
                loadPoll(pollId) {
                    const data = localStorage.getItem(pollId);
                    if (!data) {
                        alert('找不到該投票資料！');
                        this.view = 'create';
                        return;
                    }

                    this.poll = JSON.parse(data);
                    this.view = 'vote';

                    // 檢查防重覆投票 (基於 LocalStorage 紀錄)
                    const votedHistory = JSON.parse(localStorage.getItem('voted_polls') || '{}');
                    this.hasVoted = !!votedHistory[pollId];

                    // 檢查是否已截止
                    if (this.poll.deadline) {
                        this.isExpired = new Date().getTime() > new Date(this.poll.deadline).getTime();
                    }

                    // 若已投票或已過期，自動渲染圖表
                    if (this.hasVoted || this.isExpired) {
                        this.$nextTick(() => {
                            this.renderChart();
                        });
                    }
                },

                // 進行投票
                submitVote(optionIndex) {
                    if (this.hasVoted || this.isExpired) return;

                    // 更新數據
                    this.poll.votes[optionIndex]++;
                    localStorage.setItem(this.poll.id, JSON.stringify(this.poll));

                    // 標記本機設備已投票
                    const votedHistory = JSON.parse(localStorage.getItem('voted_polls') || '{}');
                    votedHistory[this.poll.id] = true;
                    localStorage.setItem('voted_polls', JSON.stringify(votedHistory));

                    this.hasVoted = true;

                    // 繪製圖表
                    this.$nextTick(() => {
                        this.renderChart();
                    });
                },

                // 計算總票數與百分比
                get totalVotes() {
                    return this.poll.votes ? this.poll.votes.reduce((a, b) => a + b, 0) : 0;
                },
                calcPercentage(votes) {
                    if (this.totalVotes === 0) return 0;
                    return ((votes / this.totalVotes) * 100).toFixed(1);
                },

                // 渲染 Chart.js 即時長條圖
                renderChart() {
                    const ctx = document.getElementById('pollChart').getContext('2d');
                    if (this.chartInstance) {
                        this.chartInstance.destroy();
                    }

                    this.chartInstance = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: this.poll.options,
                            datasets: [{
                                label: '得票數',
                                data: this.poll.votes,
                                backgroundColor: 'rgba(79, 70, 229, 0.85)',
                                borderRadius: 8,
                                borderSkipped: false,
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: false }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    ticks: { precision: 0 }
                                }
                            }
                        }
                    });
                },

                // 複製分享連結
                copyShareLink() {
                    navigator.clipboard.writeText(window.location.href);
                    alert('投票連結已複製到剪貼簿，可以傳給其他人參與投票囉！');
                },

                // 格式化日期
                formatDeadline(datetimeStr) {
                    if (!datetimeStr) return '';
                    return new Date(datetimeStr).toLocaleString('zh-TW', { dateStyle: 'short', timeStyle: 'short' });
                },

                // 重設回建立頁面
                resetToCreate() {
                    window.history.pushState({}, '', window.location.pathname);
                    this.view = 'create';
                    this.newPoll = { title: '', options: ['', ''], deadline: '' };
                }
            }
        }
    </script>
</body>
</html>
